<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JOMI AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🤖 JOMI AI</h1>

        <p class="subtitle">Your little AI assistant</p>

        <div id="chat">
            <div class="bot-message">
                <strong>JOMI:</strong> Hey! 👋 I'm JOMI AI. Ask me something!
            </div>
        </div>

        <div class="input-area">

            <input
                id="userInput"
                type="text"
                placeholder="Ask me something..."
            >

            <button id="sendButton">Send</button>

        </div>

    </div>

    <script src="script.js?v=2"></script>

</body>

</html>
